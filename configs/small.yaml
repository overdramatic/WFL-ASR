# small config for below 30 mins of data
data:
  data_dir: "training_dataset"
  sample_rate: 16000
  num_val_files: 4
  max_seq_len: null
  frame_duration: 0.02
  n_mels: 80

model:
  encoder_type: "whisper"
  whisper_model: "openai/whisper-base"

  # Computes the Whisper mel inside the DataLoader worker instead of inside
  # forward(). Bit-for-bit identical output, but off the critical path.
  # Measured on T4: 77 ms of 247 ms per step (31%). Requires num_workers > 0.
  precompute_features: true

  # false = frozen encoder in fp32 (safe, default). true = lets the encoder use
  # autocast (16-mixed): measured on T4 with a trained checkpoint,
  # 170 -> 90 ms/step (1.89x) with 99.96% of frames keeping the same label.
  # Frozen encoder = no fp16 gradient crossing its 74M params; the only risk is
  # attention overflow, counted as train/nonfinite_steps.
  # If you enable it, fine-tune and compare validation WER before trusting it.
  encoder_fp16: false


  # totally frozen encoder. below 30 mins is not enough to finetune whisper
  freeze_encoder: true
  unfreeze_last_n_layers: 0

  num_conformer_layers: 2
  conformer_heads: 2
  conformer_ff_expansion: 2
  conformer_kernel_size: 15
  conformer_dropout: 0.3

  enable_dilated_conv: true
  dilated_conv_depth: 2
  dilated_conv_kernel: 3

  subframe_loss_weight: 5.0

  lang_emb_dim: 64
  num_languages: 0

finetune:
  enabled: true
  checkpoint_path: "path/to/pretrained_model.ckpt"
  freeze_backbone: false # Set to true if you only want to train the output heads

training:
  batch_size: 4
  # Measured on T4 (benchmark cell 11, with the FE already in the worker):
  # nw=0 -> 43% wait (0.64x, the FE serializes in the main process).
  # nw=1 -> 216 ms/step, nw=2 -> 227 ms. With 2 vCPUs, two FE workers compete
  # with each other and nw=1 wins by 5%.
  num_workers: 1
  optimizer: "AdamW"

  learning_rate: 0.0001
  weight_decay: 0.01

  max_epochs: 1000
  check_val_every_n_epoch: 1 # Validate every epoch
  lr_decay_every_n_epochs: 1 # lr reduce every epoch
  lr_decay_gamma: 0.9

  max_checkpoints: 3
  log_dir: "logs/micro"
  merged_phoneme_groups: []

augmentation:
  enable: true
  noise_std: 0.01
  prob: 0.8
  volume_range: [0.5, 1.5]

output:
  save_dir: "checkpoints_micro"

postprocess:
  median_filter: 1
  merge_segments: "right"
  forced_alignment_args:
    self_loop_penalty: -4.6 # penalty for staying on the phoneme
    forward_penalty: -0.6 # penalty for switching to the next phoneme
    skip_penalty: -2.3 # penalty for skipping I phonemes
