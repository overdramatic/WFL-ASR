# small config for below 30 mins of data
data:
  data_dir: "training_dataset"
  sample_rate: 16000
  # Per-phone error rates on 4 files are noise: a phoneme seen twice with one
  # error reads 50%, so a "fix" can be a single lucky file. 30 is a floor for
  # ranking phonemes, not a target -- raise it if the corpus allows.
  # Raising it multiplies validation cost, so check_val_every_n_epoch below was
  # bumped to compensate. Changing this invalidates data_split.json: delete it
  # (on Drive, if save_dir is mounted there) or the run stops with a mismatch.
  num_val_files: 30
  max_seq_len: null
  frame_duration: 0.02
  n_mels: 80

model:
  encoder_type: "whisper"
  whisper_model: "openai/whisper-base"

  # Computes the Whisper mel inside the DataLoader worker instead of inside
  # forward(). Bit-for-bit identical output, but off the critical path.
  # Measured on T4: 77 ms of 247 ms per step (31%). Requires num_workers > 0.
  precompute_features: true

  # false = frozen encoder in fp32 (safe, default). true = lets the encoder use
  # autocast (16-mixed): measured on T4 with a trained checkpoint,
  # 170 -> 90 ms/step (1.89x) with 99.96% of frames keeping the same label.
  # Frozen encoder = no fp16 gradient crossing its 74M params; the only risk is
  # attention overflow, counted as train/nonfinite_steps.
  # If you enable it, fine-tune and compare validation WER before trusting it.
  encoder_fp16: false


  # totally frozen encoder. below 30 mins is not enough to finetune whisper
  freeze_encoder: true
  unfreeze_last_n_layers: 0

  # SpecAugment on encoder hidden states (applied after weighted sum of layers).
  # prob=0: disabled. prob>0: gate, only that fraction of batches is augmented.
  # time_mask_param: max frames to mask (at 20ms/frame, 15 = 300ms).
  # mask_value: "mean" fills masked positions with channel mean (better than 0).
  spec_aug_freq: 0
  spec_aug_time: 15
  spec_aug_prob: 0.3
  spec_aug_mask_value: "mean"

  num_conformer_layers: 2
  conformer_heads: 2
  conformer_ff_expansion: 2
  conformer_kernel_size: 15
  conformer_dropout: 0.3

  enable_dilated_conv: true
  dilated_conv_depth: 2
  dilated_conv_kernel: 3

  subframe_loss_weight: 5.0

  lang_emb_dim: 64
  num_languages: 0

finetune:
  enabled: true
  checkpoint_path: "path/to/pretrained_model.ckpt"
  freeze_backbone: false # Set to true if you only want to train the output heads

training:
  batch_size: 4
  # Measured on T4 (benchmark cell 11, with the FE already in the worker):
  # nw=0 -> 43% wait (0.64x, the FE serializes in the main process).
  # nw=1 -> 216 ms/step, nw=2 -> 227 ms. With 2 vCPUs, two FE workers compete
  # with each other and nw=1 wins by 5%.
  num_workers: 1
  optimizer: "AdamW"

  learning_rate: 0.0001
  weight_decay: 0.01

  max_epochs: 1000
  check_val_every_n_epoch: 2 # Validate every 2 epochs (was 1: 7.5x the val files)
  lr_decay_every_n_epochs: 1 # lr reduce every epoch
  lr_decay_gamma: 0.9

  max_checkpoints: 3
  log_dir: "logs/micro"
  merged_phoneme_groups: []

augmentation:
  enable: true
  noise_std: 0.01
  prob: 0.8
  volume_range: [0.5, 1.5]

output:
  save_dir: "checkpoints_micro"

postprocess:
  median_filter: 1
  # Prior on staying inside a phoneme, used when there is no transcript
  # (the forced-alignment path uses forced_alignment_args below).
  # Sweep this with tune_decode.py -- it is worth real PER.
  viterbi_bias: 5

  # Which phoneme is which type: see phoneme_map.yaml at the repo root. The
  # inventory belongs to the corpus, not to this file -- a model can be trained
  # on any language with any dictionary. Types are resolved PER LANGUAGE,
  # because the same string is not the same sound everywhere ("j" is a fricative
  # in pt and an affricate in ja).
  #
  # Point this at your own map if you trained on other languages. A type outside
  # decode.TYPE_CLASSES is a hard error, not a warning: those phonemes would
  # silently fall back to one class and the numbers would look fine.
  phoneme_map: phoneme_map.yaml

  # Per-class stay bonus, in nats PER FRAME spent on the current phoneme.
  # This is a BONUS: bigger = stays on the phoneme longer. viterbi_bias above is
  # the same number as log(bias), so viterbi_bias=5 is exactly 1.61.
  #
  # The sign is NOT the forced aligner's sign, on purpose. Here, LEAVING a
  # phoneme is free, so the I- transition value alone decides how long a
  # phoneme lasts -- a negative value would pay the decoder to leave after
  # every frame and shatter everything into one-frame phonemes. The forced
  # aligner already knows the phone order and only chooses between staying and
  # advancing, so BOTH of its costs are negative. See decode.viterbi_decode.
  #
  # One global value has to stretch a 120 ms vowel and a 15 ms plosive burst at
  # the same time, and is good at neither: too much bonus and a confident but
  # wrong phoneme swallows its neighbour (a fusion, which lands on exactly the
  # common phonemes); too little and it fragments. Four numbers cost nothing
  # and sweep with tune_decode.py.
  #
  # Keys are read at either granularity. A DURATION CLASS applies to every type
  # inside it (sonorant = nasal, liquid, trill, rhotic, semivowel); a TYPE
  # overrides just that one, which is worth it when a class is too coarse --
  # pt/rr is a trill and long, es/rr is a liquid, and the map can tell them
  # apart even though the class cannot. `obstruent` still works as an alias for
  # fricative+stop, since that is what the class used to be.
  #
  # Set to {} (or delete the block) to fall back to viterbi_bias above. When
  # this is set, viterbi_bias is ignored -- there is no silent precedence.
  stickiness_bonus_by_class:
    vowel: 1.79       # log(6): long, keep it long
    sonorant: 1.61    # log(5): nasals, liquids, trills
    fricative: 1.10   # log(3): sustained noise
    stop: 1.10        # log(3): a burst is ~1-2 frames

  # Minimum phoneme duration in seconds. Moves boundaries only, so the phone
  # sequence is preserved (safe on top of forced alignment). 0.0 disables it.
  # A principled per-class floor is ~0.02-0.03 for obstruents and ~0.04-0.07
  # for vowels; one global number has to compromise. See utils.enforce_min_duration.
  min_phoneme_duration: 0.0

  merge_segments: "right"

  # Long audio is encoded in overlapping windows; each window keeps only its
  # middle, so a phoneme on a seam is decoded with context on both sides.
  # overlap_sec: 0 goes back to non-overlapping windows. Keep chunk_sec at 28
  # so the Whisper mel padding matches training.
  chunking:
    max_sec: 28.0
    overlap_sec: 2.0

  # Amplitude-based silence. Applied to the output when there is no transcript;
  # with a transcript it is used only as EVIDENCE for where the pauses are, and
  # those pauses get inserted into the phone sequence (pad_transcript) instead.
  # Without them the forced aligner stretches speech phonemes across the gaps.
  hard_silence:
    threshold: 0.005
    min_duration: 0.5
    silence_phoneme: "SP"
    pad_transcript: true

  forced_alignment_args:
    # Same sign convention as self_loop_penalty_by_class above: negative = cost
    # per frame for staying. NOT comparable in magnitude to the free path's
    # -1.61: forced alignment knows the phone order and only has to place
    # boundaries, so it can afford a much stronger stickiness. Sweep both on
    # the same validation split.
    self_loop_penalty: -4.6
    self_loop_penalty_by_class:
      vowel: -5.0
      sonorant: -4.6
      fricative: -3.5
      stop: -3.5
    forward_penalty: -0.6 # penalty for switching to the next phoneme
    skip_penalty: -2.3 # penalty for skipping I phonemes

validation:
  # Boundary hit rates are reported at these tolerances. The largest one is the
  # headline number; 20 ms is the frame grid, so anything at or below it means
  # "on the right frame".
  boundary_tolerance_ms: [20, 40]
