# high resource config for 4+ hours of data
data:
  data_dir: "training_dataset"
  sample_rate: 16000
  num_val_files: 8
  max_seq_len: null
  frame_duration: 0.02
  n_mels: 80

model:
  encoder_type: "whisper"
  whisper_model: "openai/whisper-base"

  # Computes the Whisper mel inside the DataLoader worker instead of inside
  # forward(). Bit-for-bit identical output, but off the critical path.
  # Measured on T4: 77 ms of 247 ms per step (31%). Requires num_workers > 0.
  precompute_features: true

  # false = frozen encoder in fp32 (safe, default). true = lets the encoder use
  # autocast (16-mixed): measured on T4 with a trained checkpoint,
  # 170 -> 90 ms/step (1.89x) with 99.96% of frames keeping the same label.
  # Frozen encoder = no fp16 gradient crossing its 74M params; the only risk is
  # attention overflow, counted as train/nonfinite_steps.
  # If you enable it, fine-tune and compare validation WER before trusting it.
  encoder_fp16: false


  # unfreeze almost half the encoder for deep finetuning
  freeze_encoder: true
  unfreeze_last_n_layers: 6

  num_conformer_layers: 6
  conformer_heads: 8
  conformer_ff_expansion: 4
  conformer_kernel_size: 31
  conformer_dropout: 0.1

  enable_dilated_conv: true
  dilated_conv_depth: 3
  dilated_conv_kernel: 3

  subframe_loss_weight: 5.0

  lang_emb_dim: 128
  num_languages: 0

finetune:
  enabled: true
  checkpoint_path: "path/to/pretrained_model.ckpt"
  freeze_backbone: false # Set to true if you only want to train the output heads

training:
  batch_size: 16
  num_workers: 8
  optimizer: "AdamW"

  learning_rate: 0.00005
  weight_decay: 0.001

  max_epochs: 1000
  check_val_every_n_epoch: 1

  lr_decay_every_n_epochs: 5
  lr_decay_gamma: 0.95

  precision: "16-mixed"

  accumulate_grad_batches: 1

  max_checkpoints: 5
  log_dir: "logs/high"
  merged_phoneme_groups: []

augmentation:
  enable: true
  noise_std: 0.002
  prob: 0.3
  volume_range: [0.9, 1.1]

output:
  save_dir: "checkpoints_high"

postprocess:
  median_filter: 1
  # Prior on staying inside a phoneme, used when there is no transcript
  # (the forced-alignment path uses forced_alignment_args below).
  # Sweep this with tune_decode.py -- it is worth real PER.
  viterbi_bias: 5
  merge_segments: "right"
  forced_alignment_args:
    self_loop_penalty: -4.6 # penalty for staying on the phoneme
    forward_penalty: -0.6 # penalty for switching to the next phoneme
    skip_penalty: -2.3 # penalty for skipping I phonemes

validation:
  # Boundary hit rates are reported at these tolerances. The largest one is the
  # headline number; 20 ms is the frame grid, so anything at or below it means
  # "on the right frame".
  boundary_tolerance_ms: [20, 40]

  # Which phoneme the model actually gets wrong, aligned against the original
  # .lab like PER is. Logged as a figure (val/confusion_matrix) and a text
  # summary (val/confusion_top), with the counts in <save_dir>/confusion_matrix.csv.
  confusion_matrix:
    enabled: true
    top_k: 25          # worst lab->decoded pairs to plot, one bar each
    min_count: 1       # drop pairs below this count, so coincidences stay quiet
    normalize: true    # label each bar with the % of that lab phoneme too
    console_top: 3     # worst pairs appended to the VALID line
    csv: true          # write the raw counts to <save_dir>/confusion_matrix.csv
